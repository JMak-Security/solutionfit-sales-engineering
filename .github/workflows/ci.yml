name: CI

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Format
        run: python -m ruff format --check src tests scripts
      - name: Strict types
        run: python -m mypy src tests scripts
      - name: Tests and coverage
        run: python -m pytest --cov=solutionfit --cov-report=xml --cov-report=term-missing
      - name: Build container
        run: docker compose build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip for security audit
        run: python -m pip install --upgrade "pip>=26.2,<27"
      - name: Install package and scanners
        run: python -m pip install -e ".[dev]"
      - name: Dependency audit
        run: python -m pip_audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --pyproject pyproject.toml --output-file sbom.json --output-format JSON
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json
