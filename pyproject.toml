[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solutionfit-sales-engineering"
version = "1.0.0"
description = "Auditable sales-engineering scenario toolkit for a fictional QA product"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "JMak-Security" }]
dependencies = [
    "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "cyclonedx-bom>=5",
    "hypothesis>=6.120",
    "mypy>=1.14",
    "pip-audit>=2.7",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6",
    "ruff>=0.9",
    "types-reportlab>=4.2",
]

[project.scripts]
solutionfit = "solutionfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["solutionfit"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
